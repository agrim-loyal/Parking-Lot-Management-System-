<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parking Lot Status Applet</title>
</head>
<body>
    <h2>BCO 035B - Parking Lot JApplet Demo</h2>
    <p>Run with: <code>appletviewer applet/parking_applet.html</code> (from project root after compiling to <code>bin/</code>).</p>
    <applet code="com.parking.ui.ParkingStatusApplet" codebase="../bin" width="600" height="220">
        <param name="lotName" value="University Central Parking">
        <param name="floors" value="2">
        <param name="spotsPerFloor" value="12">
        Your browser does not support Java Applets. Use JDK 8 appletviewer.
    </applet>
</body>
</html>
